name: Build Windows Installer

# Builds BrewPOS on every push to lan-local, using a real Windows
# environment (GitHub's windows-latest runner) — this avoids the
# reliability problems of cross-compiling native Windows modules (like the
# USB printer driver) from a non-Windows machine.
#
# Produces FOUR downloadable artifacts per run, each named with a build ID
# (date + short commit SHA) so it's always clear exactly which build a
# given download is:
#   BrewPOS-Pilot-<buildId>-Setup.exe            (real installer, your data)
#   BrewPOS-Pilot-<buildId>-Portable.exe          (portable, your data — for fast test iteration)
#   BrewPOS-Pilot-<buildId>-Vanilla-Setup.exe     (real installer, BLANK — no seeded data)
#   BrewPOS-Pilot-<buildId>-Vanilla-Portable.exe  (portable, BLANK — no seeded data)
#
# "Vanilla" builds skip the first-run data seed entirely (see
# server/local-db.js's VANILLA_BUILD marker check) — use these to test
# exactly what a brand-new customer's first launch looks like.
#
# Each variant's artifacts are uploaded immediately after it's built,
# rather than all at the end — this way, even if electron-builder clears
# its output directory between the two build passes, the first variant's
# files are already safely uploaded before that risk applies.
on:
  push:
    branches: [lan-local]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Compute build ID
        id: buildid
        shell: bash
        run: |
          DATE=$(date +%Y%m%d)
          SHA=$(git rev-parse --short HEAD)
          echo "value=${DATE}-${SHA}" >> "$GITHUB_OUTPUT"

      - name: Install app dependencies
        run: npm install

      - name: Fix electron/electron-builder dependency placement
        shell: pwsh
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            let changed = false;
            for (const pkg of ['electron', 'electron-builder']) {
              if (p.dependencies && p.dependencies[pkg]) {
                p.devDependencies = p.devDependencies || {};
                p.devDependencies[pkg] = p.dependencies[pkg];
                delete p.dependencies[pkg];
                changed = true;
              }
            }
            if (!p.author) { p.author = 'Headshot Coffee'; changed = true; }
            if (!p.description) { p.description = 'BrewPOS — café point-of-sale system for Headshot Coffee'; changed = true; }
            if (changed) {
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('Fixed package.json (electron-builder requires electron/electron-builder in devDependencies).');
            }
          "

      - name: Install local server dependencies
        working-directory: server
        run: npm install

      # --- Seeded variant (your data) ---

      - name: Set build-ID artifact names (seeded variant)
        shell: bash
        run: node scripts/set-artifact-names.cjs "${{ steps.buildid.outputs.value }}"

      - name: Build seeded variant (your data)
        id: build_seeded
        shell: pwsh
        run: |
          npm run electron:build -- --publish never 2>&1 | Tee-Object -FilePath build-log-seeded.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload seeded installer
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-Pilot-${{ steps.buildid.outputs.value }}-Setup
          path: release/BrewPOS-Pilot-${{ steps.buildid.outputs.value }}-Setup.exe
          if-no-files-found: error

      - name: Upload seeded portable
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-Pilot-${{ steps.buildid.outputs.value }}-Portable
          path: release/BrewPOS-Pilot-${{ steps.buildid.outputs.value }}-Portable.exe
          if-no-files-found: error

      # --- Vanilla variant (blank, no seeded data) ---
      # Disabled per Peter's request (2026-08-20) — he'll ask for the next
      # vanilla build when he needs one for the next iteration. Flip these
      # four `if: false` back to remove (or `if: true`) to re-enable.

      - name: Switch to vanilla (blank, no seeded data)
        if: false
        shell: bash
        run: |
          touch server/VANILLA_BUILD
          node scripts/set-artifact-names.cjs "${{ steps.buildid.outputs.value }}" vanilla

      - name: Build vanilla variant (blank)
        if: false
        id: build_vanilla
        shell: pwsh
        run: |
          npm run electron:build -- --publish never 2>&1 | Tee-Object -FilePath build-log-vanilla.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload vanilla installer
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-Pilot-${{ steps.buildid.outputs.value }}-Vanilla-Setup
          path: release/BrewPOS-Pilot-${{ steps.buildid.outputs.value }}-Vanilla-Setup.exe
          if-no-files-found: error

      - name: Upload vanilla portable
        if: false
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-Pilot-${{ steps.buildid.outputs.value }}-Vanilla-Portable
          path: release/BrewPOS-Pilot-${{ steps.buildid.outputs.value }}-Vanilla-Portable.exe
          if-no-files-found: error

      - name: Publish logs for debugging (always)
        if: always()
        shell: bash
        run: |
          git config user.email "ci@brewpos.local"
          git config user.name "BrewPOS CI"
          git fetch origin ci-logs 2>/dev/null || true
          git checkout --orphan ci-logs-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp build-log-seeded.txt build-log-seeded.txt.tmp 2>/dev/null || echo "no log" > build-log-seeded.txt.tmp
          mv build-log-seeded.txt.tmp build-log-seeded.txt
          cp build-log-vanilla.txt build-log-vanilla.txt.tmp 2>/dev/null || echo "no log" > build-log-vanilla.txt.tmp
          mv build-log-vanilla.txt.tmp build-log-vanilla.txt
          git add build-log-seeded.txt build-log-vanilla.txt
          git commit -m "CI log: run ${{ github.run_id }}"
          git push origin ci-logs-tmp:ci-logs --force
