name: Build Windows Installer

# Builds a double-click BrewPOS installer on every push to lan-local, using
# a real Windows environment (GitHub's windows-latest runner) — this avoids
# the reliability problems of cross-compiling native Windows modules (like
# the USB printer driver) from a non-Windows machine. The finished installer
# is attached to the workflow run as a downloadable artifact.
on:
  push:
    branches: [lan-local]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm install

      - name: Install local server dependencies
        working-directory: server
        run: npm install

      - name: Build the Windows installer
        run: npm run electron:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
