name: Build Windows Installer

# Builds a double-click BrewPOS installer on every push to lan-local, using
# a real Windows environment (GitHub's windows-latest runner) — this avoids
# the reliability problems of cross-compiling native Windows modules (like
# the USB printer driver) from a non-Windows machine. The finished installer
# is attached to the workflow run as a downloadable artifact.
on:
  push:
    branches: [lan-local]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install app dependencies
        run: npm install

      - name: Fix electron/electron-builder dependency placement
        shell: pwsh
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            let changed = false;
            for (const pkg of ['electron', 'electron-builder']) {
              if (p.dependencies && p.dependencies[pkg]) {
                p.devDependencies = p.devDependencies || {};
                p.devDependencies[pkg] = p.dependencies[pkg];
                delete p.dependencies[pkg];
                changed = true;
              }
            }
            if (!p.author) { p.author = 'Headshot Coffee'; changed = true; }
            if (!p.description) { p.description = 'BrewPOS — café point-of-sale system for Headshot Coffee'; changed = true; }
            if (changed) {
              fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n');
              console.log('Fixed package.json (electron-builder requires electron/electron-builder in devDependencies).');
            }
          "

      - name: Install local server dependencies
        working-directory: server
        run: npm install

      - name: Build the Windows installer
        id: build
        shell: pwsh
        run: |
          npm run electron:build -- --publish never 2>&1 | Tee-Object -FilePath build-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish log for debugging (always)
        if: always()
        shell: bash
        run: |
          git config user.email "ci@brewpos.local"
          git config user.name "BrewPOS CI"
          git fetch origin ci-logs 2>/dev/null || true
          git checkout --orphan ci-logs-tmp
          git rm -rf . > /dev/null 2>&1 || true
          cp build-log.txt build-log.txt.tmp 2>/dev/null || echo "no log" > build-log.txt.tmp
          mv build-log.txt.tmp build-log.txt
          git add build-log.txt
          git commit -m "CI log: run ${{ github.run_id }}"
          git push origin ci-logs-tmp:ci-logs --force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BrewPOS-Windows-Installer
          path: release/*.exe
          if-no-files-found: error
